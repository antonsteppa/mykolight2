<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0f">
<title>⚡ Графік відключень — Миколаїв</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--bg2:#0f0f1a;--bg3:#14141f;--bg4:#1a1a28;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);--text:#e8e8f0;--text2:#8888a8;--text3:#4a4a6a;--accent:#4f7fff;--accent2:#3a5fcc;--green:#22c55e;--red:#ef4444;--orange:#f97316;--mono:'JetBrains Mono',monospace;--display:'Unbounded',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--mono);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(79,127,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(79,127,255,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:800px;margin:30px auto;padding:0 24px 60px}
header{padding:32px 0 24px;text-align:center;border-bottom:1px solid var(--border);margin-bottom:32px}
.logo-line{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:8px}
.bolt{font-size:28px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(.95)}}
h1{font-family:var(--display);font-size:clamp(18px,4vw,26px);font-weight:700;letter-spacing:-.02em;color:#fff}
.subtitle{font-size:11px;color:var(--text2);letter-spacing:.15em;text-transform:uppercase;margin-top:4px}
.time-bar{display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 20px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;margin:20px 0 0;font-size:12px;color:var(--text2);flex-wrap:wrap}
#clock{color:var(--accent);font-size:15px;font-weight:600;letter-spacing:.08em}
.upd-dot{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;margin-right:4px;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* Accordion */
.acc{background:var(--bg2);border:1px solid var(--border2);border-radius:12px;margin-bottom:16px;overflow:visible}
.acc-head{display:flex;align-items:center;padding:14px 20px;cursor:pointer;gap:12px;user-select:none}
.acc-head:hover{background:var(--bg3)}
.acc-arrow{font-size:10px;color:var(--text3);transition:transform .2s;flex-shrink:0}
.acc-arrow.open{transform:rotate(180deg)}
.acc-title{font-family:var(--display);font-size:12px;font-weight:500;color:var(--text2);letter-spacing:.05em}
.acc-body{display:none;padding:0 20px 20px;overflow:visible}
.acc-body.open{display:block;overflow:visible}

/* Search */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media(max-width:500px){.fields{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.12em}
.sel-wrap{position:relative}
.sel-face{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:13px;padding:10px 32px 10px 12px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none;transition:border-color .2s}
.sel-face.off{opacity:.4;cursor:not-allowed;pointer-events:none}
.sel-face:not(.off):hover{border-color:var(--accent)}
.sel-arrow{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;font-size:10px}
.sel-drop{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.6);flex-direction:column;max-height:260px}
.sel-drop.open{display:flex}
.sel-srch{background:var(--bg4);border:none;border-bottom:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:12px;padding:8px 12px;outline:none;flex-shrink:0;border-radius:8px 8px 0 0}
.sel-srch::placeholder{color:var(--text3)}
.sel-opts{overflow-y:auto;flex:1}
.sel-opt{padding:9px 12px;font-size:13px;cursor:pointer;color:var(--text);transition:background .1s}
.sel-opt:hover{background:var(--bg4)}
.sel-opt.sel{color:var(--accent)}
.sel-none{padding:10px 12px;font-size:12px;color:var(--text3)}
.btn-search{grid-column:1/-1;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:12px;font-family:var(--display);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;letter-spacing:.05em;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-search:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-search:disabled{opacity:.5;cursor:not-allowed;transform:none}
.err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.2);border-radius:8px;padding:12px;font-size:12px;color:var(--red);margin-top:8px;display:none}
.err.on{display:block}
.saved{display:inline-flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:6px 14px;font-size:11px;color:var(--text2);margin-top:12px}

/* Result */
.result-card{background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:20px;margin-bottom:16px;display:none;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.result-card.on{display:block}
.result-status{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.status-icon{font-size:28px}
.status-text h2{font-family:var(--display);font-size:16px;font-weight:500}
.status-text p{font-size:12px;color:var(--text2);margin-top:2px}
.queue-badge{display:inline-flex;align-items:center;padding:6px 14px;border-radius:6px;font-family:var(--display);font-size:20px;font-weight:700;margin:8px 0}
.queue-badge.off{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.2)}
.queue-badge.on{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.2)}
  let nx=-1;
  for(let i=s+1;i<48;i++){const v=arr[i],iO=v===1||v===2||v===3;if(iO!==off){nx=i;break;}}
  if(nx===-1){document.getElementById('t-val').textContent='Без змін';document.getElementById('t-desc').textContent='До кінця доби';return;}
  const now=new Date(),nt=new Date(now);
  nt.setHours(Math.floor(nx/2),(nx%2)*30,0,0);
  const d=nt-now,h=Math.floor(d/3600000),m=Math.floor((d%3600000)/60000),sc=Math.floor((d%60000)/1000);
  document.getElementById('t-val').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sc).padStart(2,'0')}`;
  document.getElementById('t-desc').textContent=`Зміна о ${String(Math.floor(nx/2)).padStart(2,'0')}:${(nx%2)*30===0?'00':'30'}`;
}

/* Schedule */
async function fetchSched(){
  try{
    const ts=Date.now();
    const [q,a]=await Promise.all([go(BASE+'/outage-queue/by-type/3?_='+ts),go(BASE+'/schedule/active?_='+ts)]);
    QM={};q.forEach(function(x){if(x.id&&x.name)QM[x.id]=x.name;});

    ALL_SCHED={};
    // New format: [{from, to, series:[{time_series_id, outage_queue_id, type}]}]
    if(a.length && a[0].series){
      a.forEach(function(sched){
        var dateKey=null;
        if(sched.from){
          // Convert UTC to local date
          var d=new Date(sched.from);
          var local=new Date(d.getTime()+d.getTimezoneOffset()*60000+3*3600000);
          dateKey=local.getFullYear()+'-'+String(local.getMonth()+1).padStart(2,'0')+'-'+String(local.getDate()).padStart(2,'0');
        }
        if(!dateKey) return;
        if(!ALL_SCHED[dateKey]){ALL_SCHED[dateKey]={};QO.forEach(function(x){ALL_SCHED[dateKey][x]=new Array(48).fill(0);});}
        (sched.series||[]).forEach(function(x){
          var qn=QM[x.outage_queue_id];
          if(qn&&ALL_SCHED[dateKey][qn]){
            var i=x.time_series_id-1;
            var s=0;if(x.type==='OFF')s=1;else if(x.type==='PROBABLY_OFF')s=2;else if(x.type==='SURE_OFF')s=3;
            if(i>=0&&i<48)ALL_SCHED[dateKey][qn][i]=s;
          }
        });
      });
    } else {
      // Old flat format
      var today=new Date().toISOString().substring(0,10);
      ALL_SCHED[today]={};QO.forEach(function(x){ALL_SCHED[today][x]=new Array(48).fill(0);});
      a.forEach(function(x){
        var qn=QM[x.outage_queue_id];
        if(qn&&ALL_SCHED[today][qn]){
          var i=x.time_series_id-1;
          var s=0;if(x.type==='OFF')s=1;else if(x.type==='PROBABLY_OFF')s=2;else if(x.type==='SURE_OFF')s=3;
          if(i>=0&&i<48)ALL_SCHED[today][qn][i]=s;
        }
      });
    }

    DATES=Object.keys(ALL_SCHED).sort();
    var today=new Date().toISOString().substring(0,10);
    selDate=DATES.includes(today)?today:(DATES[0]||today);
    SD=ALL_SCHED[selDate]||{};

    renderDateBar();
    renderSched();
    if(myQ)updTimer(myQ);
  }catch(e){
    document.getElementById('sched-body').innerHTML='<div style="padding:20px;font-size:12px;color:var(--red)">Помилка: '+e.message+'</div>';
  }
}

function renderDateBar(){
  var bar=document.getElementById('date-bar');
  if(DATES.length<=1){bar.style.display='none';return;}
  bar.style.display='flex';
  bar.innerHTML=DATES.map(function(d){
    var parts=d.split('-');
    var label=parts[2]+'.'+parts[1]+'.'+parts[0];
    return '<button class="date-btn'+(d===selDate?' act':'')+'" data-d="'+d+'">'+label+'</button>';
  }).join('');
  bar.querySelectorAll('.date-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      selDate=btn.dataset.d;
      SD=ALL_SCHED[selDate]||{};
      bar.querySelectorAll('.date-btn').forEach(function(b){b.classList.toggle('act',b.dataset.d===selDate);});
      var d=new Date(selDate);
      const sd = document.getElementById('sched-date');
      if(sd) sd.textContent='Погодинний графік · '+d.toLocaleDateString('uk-UA',{day:'numeric',month:'long',year:'numeric'});
      renderSched();
      if(myQ)updTimer(myQ);
    });
  });
}

function renderSched(){
  if(!activeQ.length){
    document.getElementById('sched-body').innerHTML='<div style="padding:20px;font-size:12px;color:var(--text3);text-align:center">Оберіть черги для відображення</div>';
    return;
  }
  const qs=activeQ;
  const now=new Date().getHours(), cs=slot();
  let h='<div class="bar-wrap">';
  qs.forEach(q=>{
    const arr=SD[q]||new Array(48).fill(0);
    h+=`<div class="bar-row"><div class="bar-lbl${q===myQ?' my':''}">${q}</div><div class="bar-track">`;
    for(let hr=0;hr<24;hr++){
      const s1=arr[hr*2], s2=arr[hr*2+1];
      const cur1=(hr*2===cs), cur2=(hr*2+1===cs);
      const hStr = String(hr).padStart(2,'0') + ':00';
      h+=`<div class="bar-hour" data-h="${hStr}">`;
      h+=`<div class="bar-seg s${Math.min(s1,3)}${cur1?' now':''}" title="${hStr}"></div>`;
      h+=`<div class="bar-seg s${Math.min(s2,3)}${cur2?' now':''}" title="${String(hr).padStart(2,'0')}:30"></div>`;
      h+=`</div>`;
    }
    h+='</div></div>';
  });
  h+='<div class="bar-axis">';
  for(let i=0;i<24;i++){
    h+=`<div class="bar-tick${i===now?' now':''}"><span>${String(i).padStart(2,'0')}</span></div>`;
    h+=`<div class="bar-tick half"></div>`;
  }
  h+='</div></div>';
  document.getElementById('sched-body').innerHTML=h;
}

function showErr(m){const e=document.getElementById('err');e.textContent=m;e.classList.add('on');}
function hideErr(){document.getElementById('err').classList.remove('on');}

init();
</script>
</body>
</html>
